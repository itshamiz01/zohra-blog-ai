name: Zohra CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zohra_test
          POSTGRES_USER: zohra
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Unit & Integration Tests
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: test-ci-secret-key-32-chars-long!
        run: |
          pytest --cov=app --cov-report=xml -v

      - name: Verify Docker Production Build
        run: |
          docker build -f Dockerfile.prod -t zohra-publisher:ci .
